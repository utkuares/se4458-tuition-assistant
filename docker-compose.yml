services:
  db:
    image: postgres:16-alpine
    container_name: tuition-db
    environment:
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition_dev_pw
      POSTGRES_DB: tuition
    ports:
      - "5432:5432"
    volumes:
      - tuition_db_data:/var/lib/postgresql/data

  db_test:
    image: postgres:16-alpine
    container_name: tuition-db-test
    environment:
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition_test_pw
      POSTGRES_DB: tuition_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  gateway:
    image: kong:3.9
    container_name: tuition-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tuition_db_data:
